# Build and test on the platforms the app ships for.
#
# macOS and Linux both run the full suite, because a good third of the tests are about things that
# differ between them: socket error kinds, audio device enumeration, path handling. Windows builds but
# does not run the audio-device tests under a headless runner, where there is no device to enumerate —
# that is stated in the step rather than worked around, because a test that passes by being skipped is
# worse than one that is honestly not run.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Debug info is the bulk of the target directory and nothing here reads a backtrace from CI.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Link libopus into the binary rather than against a library the host has to provide.
  OPUS_STATIC: "1"
  # The vendored libopus asks for `cmake_minimum_required(VERSION 3.1)`, and CMake 4 — which is what
  # the runners have — refuses anything below 3.5 outright. This is CMake's own escape hatch for
  # exactly that situation, and it is the difference between a release with downloads and one without.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.name }})

    # bash on all three, so one set of commands works everywhere — Windows runners have it, and the
    # alternative is maintaining a PowerShell copy of every step.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # ALSA for cpal, the xcb/xkb set for winit, cmake to build libopus from source, nasm for
      # OpenH264's assembly paths. Without ALSA the client does not build at all; without cmake the
      # opus binding fails in its build script; without nasm it builds and is slower.
      - name: system libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            cmake nasm

      # libopus itself, rather than the cmake to build it from source. Homebrew ships `libopus.a`, so
      # `pkg-config` finds it, `OPUS_STATIC` links it *into* the binary, and the resulting app has no
      # dependency on Homebrew at all — which is what a downloadable release needs. The source build is
      # still there as the fallback, hence cmake, and hence `CMAKE_POLICY_VERSION_MINIMUM` above: the
      # vendored copy of opus asks for CMake 3.1 and CMake 4 refuses anything below 3.5.
      - name: libopus (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install pkg-config opus || brew upgrade pkg-config opus || true
          pkg-config --modversion opus || echo "no pkg-config opus — falling back to the source build"
          cmake --version || brew install cmake

      # Windows has no pkg-config to find a libopus with, so `audiopus_sys` compiles it from source with
      # whatever CMake the runner ships. That is CMake 4, which refuses the vendored copy's
      # `cmake_minimum_required(VERSION 3.1)` — hence `CMAKE_POLICY_VERSION_MINIMUM` at the top of this
      # file. Pinning an older CMake instead does not work: one old enough to accept 3.1 is too old to
      # know the runner's Visual Studio, and it fails printing its list of generators.
      - name: cmake (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --version

      # Output is captured and, on failure, echoed back as workflow annotations. Without this the only
      # public record of a failed build is its exit code: the log itself needs admin rights to read
      # through the API, which is exactly the wrong way round when the point of CI is to tell you what
      # broke.
      - name: build
        run: |
          set -o pipefail
          cargo build --workspace --all-targets 2>&1 | tee build.log

      - name: test
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log

      # No `cargo fmt --check`. The code is laid out by hand at a wider width than rustfmt's
      # default, as its sibling projects are, and a formatting gate would reflow it rather than tidy
      # it. Clippy is the gate that catches things that are actually wrong.
      - name: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log

      # A failure here has to explain itself in the annotations, because the log itself needs admin
      # rights to read through the API — the wrong way round when the point of CI is to say what
      # broke. The first attempt at this looked for compiler diagnostics and found none, which was
      # itself the useful finding: the failure is not rustc. So this prints the tail of whatever
      # happened, verbatim.
      - name: what went wrong
        if: failure()
        run: |
          ls -la ./*.log || echo "no logs were written at all"
          df -h . | tail -2 || true
          python3 - <<'PY'
          import glob, os

          def annotate(title, text):
              flat = text.replace("%", "%25").replace("\r", "")
              flat = flat.replace("\n", "%0A")[:4000]
              print(f"::error title={title}::{flat}")

          found = False
          for path in ("build.log", "test.log", "clippy.log"):
              if not os.path.exists(path):
                  continue
              found = True
              with open(path, encoding="utf-8", errors="replace") as handle:
                  lines = handle.read().splitlines()
              # The tail, which for a build script or a linker failure is where the reason is.
              annotate(f"{path} (last 60 lines)", "\n".join(lines[-60:]))
              # And any line that looks like a diagnosis, wherever it is.
              interesting = [
                  line for line in lines
                  if line.startswith("error")
                  or "failed to run custom build command" in line
                  or "linking with" in line
                  or "No space left" in line
                  or "signal:" in line
                  or "not found" in line
              ]
              if interesting:
                  annotate(f"{path} (diagnoses)", "\n".join(interesting[:40]))
          if not found:
              annotate("no log", "the step failed before writing a log — see the run's own output")
          PY

  # The image is built on every push so a broken Dockerfile is found here rather than on the server
  # somebody is trying to update. It is not pushed — that is release.yml's job.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: boavoice-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
