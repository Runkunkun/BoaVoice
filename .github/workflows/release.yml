# Build the downloadable apps and publish them, plus the server image.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Three platforms, three artefacts, one release. macOS gets two — Apple silicon and Intel — because a
# universal binary would need both toolchains in one job and `lipo`, and two files with obvious names
# is less to go wrong than one file that might have been built wrong.
#
# **The apps are not notarised.** That needs a paid Apple developer identity, which this project does
# not have, so macOS quarantines the download and says the app "is damaged". It is not; the release
# notes say the one command that clears it. Being explicit about that is the whole reason the notes
# are written here rather than left to GitHub's autogenerated list.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a re-run)"
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: apple-silicon
          - target: x86_64-apple-darwin
            name: intel
    runs-on: macos-latest
    name: macOS (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: build
        run: cargo build --release --target ${{ matrix.target }} --bin boavoice

      # The bundle script reads target/release; a cross-target build puts it one level deeper.
      - name: assemble the app
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/boavoice target/release/boavoice
          python3 scripts/bundle-macos.py

      # `ditto` rather than `zip`: it preserves the resource forks and the ad-hoc signature, and a
      # plain `zip` produces a bundle macOS refuses to launch.
      - name: zip it
        run: |
          ditto -c -k --keepParent dist/BoaVoice.app \
            "BoaVoice-macOS-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: BoaVoice-macOS-${{ matrix.name }}.zip

  linux:
    runs-on: ubuntu-22.04
    name: Linux (AppImage)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      # 22.04 rather than latest, deliberately: an AppImage takes its libc from the *host* it runs on,
      # so building against a newer glibc than the oldest distribution anybody uses produces a file
      # that fails with a version error somewhere else.
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfuse2 nasm

      - name: build
        run: cargo build --release --bin boavoice

      - name: appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: build the AppImage
        run: scripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/BoaVoice-x86_64.AppImage

  windows:
    runs-on: windows-latest
    name: Windows (.exe)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
      - name: build
        run: cargo build --release --bin boavoice
      - name: collect
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\boavoice.exe dist\BoaVoice.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/BoaVoice.exe

  docker:
    runs-on: ubuntu-latest
    name: server image
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The repository owner, lowercased: ghcr.io rejects an uppercase path, and GitHub usernames are
      # allowed to have capitals.
      - name: image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/boavoice-server" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both, because a self-hosted server is as likely to be an ARM box at home as an x86 one in
          # a datacentre.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [macos, linux, windows, docker]
    runs-on: ubuntu-latest
    name: publish the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: notes
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/boavoice-server"
          cat > notes.md <<EOF
          ## BoaVoice $VERSION

          | Download | For |
          |---|---|
          | \`BoaVoice-macOS-apple-silicon.zip\` | Macs with an M-series chip |
          | \`BoaVoice-macOS-intel.zip\` | Intel Macs |
          | \`BoaVoice-x86_64.AppImage\` | Linux (\`chmod +x\`, then run it) |
          | \`BoaVoice.exe\` | Windows |

          ### macOS: the first launch needs one command

          These builds are signed ad-hoc, not notarised — that needs a paid Apple developer
          identity. macOS therefore quarantines the download and reports that the app "is damaged
          and can't be opened". It is not damaged; clearing the quarantine flag is the fix:

          \`\`\`sh
          unzip BoaVoice-macOS-apple-silicon.zip -d /Applications
          xattr -dr com.apple.quarantine /Applications/BoaVoice.app
          open /Applications/BoaVoice.app
          \`\`\`

          macOS will then ask for microphone access, which the app needs for voice, and for screen
          recording the first time you share a screen.

          ### The server

          \`\`\`sh
          docker run -d --name boavoice \\
            -p 8787:8787/tcp -p 8788:8788/udp \\
            -v /srv/boavoice:/data \\
            -e BOA_NAME="Home" \\
            $IMAGE:$VERSION
          \`\`\`

          **Publish both ports.** The UDP one carries voice and screens and cannot go through an HTTP
          reverse proxy; without it chat works perfectly and nobody can hear anybody.

          ### Sharing a screen needs ffmpeg

          Watching one does not. \`brew install ffmpeg\`, \`apt install ffmpeg\`, or
          \`winget install Gyan.FFmpeg\`. Sharing the machine's *sound* also needs a loopback device
          on macOS and Windows — \`cargo run --example loopbackcheck\` says what is missing.
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: BoaVoice ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
