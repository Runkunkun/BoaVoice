  <!-- BoaVoice: a boa's head from above.

       Two filled shapes make the head — `Path` and `Path_Copy`, mirrored — and four more sit on top
       of them in white: the two halves of the inner cross, and the two eyes. No outlines anywhere.

       The export gave all six the same black fill, which renders as a featureless silhouette; the
       colours here are the drawing as it was meant. scripts/raster-svg.sh separates the two layers
       into the masks make-icon.py composites, and the ink and highlight colours are chosen there —
       so these two values are documentation rather than decisions.
  -->
